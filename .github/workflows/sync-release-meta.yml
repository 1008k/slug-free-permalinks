name: Sync release metadata

on:
  push:
    branches:
      - release-1.5.1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: release-1.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Sync metadata
        run: node scripts/sync-meta.mjs

      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slug-free-permalinks.php readme.txt README.md README-ja.md languages/
          git commit -m "Sync metadata for 1.5.1"
          git push origin HEAD:release-1.5.1
