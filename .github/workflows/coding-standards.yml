name: Coding Standards

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: coding-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './dist/*' \
            -print0 \
            | xargs -0 -n1 php -l

      - name: Run WordPress Coding Standards
        run: composer check

  release-tooling:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test release tooling
        run: node --test tests/scripts/*.test.mjs

      - name: Verify synchronized metadata is committed
        run: |
          node scripts/sync-meta.mjs
          git diff --exit-code -- slug-free-permalinks.php readme.txt README.md README-ja.md languages/
