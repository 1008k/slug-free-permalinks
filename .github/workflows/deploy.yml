name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to deploy
        required: true
        type: string

concurrency:
  group: deploy-wordpress-org-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-metadata.mjs "$RELEASE_VERSION"
          echo "WPORG_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build distributable
        run: node scripts/build-dist.mjs

      - name: Verify distributable
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/slug-free-permalinks/slug-free-permalinks.php
          test -f dist/slug-free-permalinks/readme.txt

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: slug-free-permalinks
          VERSION: ${{ env.WPORG_VERSION }}
          BUILD_DIR: dist/slug-free-permalinks
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
