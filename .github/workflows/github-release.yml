name: Create GitHub Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-metadata.mjs "$GITHUB_REF_NAME"

      - name: Build release ZIP
        run: node scripts/build-dist.mjs --zip

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          ZIP_PATH="dist/slug-free-permalinks-${VERSION}.zip"
          NOTES_FILE="$(mktemp)"
          CHANGELOG_LINES="$(
            awk -v version="$VERSION" '
              $0 == "= " version " =" { in_section=1; next }
              in_section && /^= / { exit }
              in_section { print }
            ' readme.txt \
            | sed '/^[[:space:]]*$/d'
          )"

          if [[ -z "$CHANGELOG_LINES" ]]; then
            echo "Could not extract changelog entries for $VERSION from readme.txt" >&2
            exit 1
          fi

          {
            echo "## Changelog"
            echo
            echo "$CHANGELOG_LINES"
          } > "$NOTES_FILE"

          gh release create "$VERSION" "$ZIP_PATH" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE"
