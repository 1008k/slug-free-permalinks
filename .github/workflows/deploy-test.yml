name: Deploy Test Site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slug-free-permalinks-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build distributable
        run: node scripts/build-dist.mjs

      - name: Verify distributable
        run: |
          set -euo pipefail
          test -f dist/slug-free-permalinks/slug-free-permalinks.php
          test -f dist/slug-free-permalinks/readme.txt

      - name: Deploy plugin over SSH
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          TEST_PLUGIN_DIR: ${{ vars.TEST_PLUGIN_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          for key in TEST_SSH_HOST TEST_SSH_USER TEST_SSH_PRIVATE_KEY TEST_SSH_KNOWN_HOSTS TEST_PLUGIN_DIR; do
            if [[ -z "${!key}" ]]; then
              echo "Missing test environment setting: $key" >&2
              exit 1
            fi
          done

          # Reject unexpected paths and shell metacharacters.
          if [[ ! "$TEST_PLUGIN_DIR" =~ ^/[a-zA-Z0-9_./-]+/wp-content/plugins/slug-free-permalinks/?$ ]] ||
             [[ "/$TEST_PLUGIN_DIR/" == *"/../"* ]] ||
             [[ "/$TEST_PLUGIN_DIR/" == *"/./"* ]]; then
            echo "TEST_PLUGIN_DIR must be an absolute plugin directory path without traversal" >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/test_deploy_key
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/test_deploy_key ~/.ssh/known_hosts
          unset TEST_SSH_PRIVATE_KEY TEST_SSH_KNOWN_HOSTS

          SSH_COMMAND="ssh -i $HOME/.ssh/test_deploy_key -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # Only create/update the target plugin directory; never delete remote files.
          $SSH_COMMAND "$TEST_SSH_USER@$TEST_SSH_HOST" "mkdir -p '$TEST_PLUGIN_DIR'"
          rsync -rlz --no-perms --no-owner --no-group --omit-dir-times \
            -e "$SSH_COMMAND" \
            dist/slug-free-permalinks/ \
            "$TEST_SSH_USER@$TEST_SSH_HOST:$TEST_PLUGIN_DIR/"

          echo "Deployed ${GITHUB_SHA} to the test plugin directory."
