name: Update WordPress.org Assets

on:
  push:
    branches:
      - main
    paths:
      - .wordpress-org/**
      - .github/workflows/update-wordpress-org-assets.yml
  workflow_dispatch:

concurrency:
  group: update-wordpress-org-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update WordPress.org assets
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # stable / 2.2.0
        env:
          SLUG: slug-free-permalinks
          IGNORE_OTHER_FILES: true
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
